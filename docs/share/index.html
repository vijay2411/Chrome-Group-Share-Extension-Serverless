<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GroupShare - Shared Tabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 520px; width: 100%; }
    header { text-align: center; margin-bottom: 36px; }
    header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #fafafa;
      letter-spacing: -0.3px;
    }
    header p {
      color: #666;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 400;
    }
    .card {
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 12px;
    }
    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .group-title {
      font-size: 15px;
      font-weight: 600;
      color: #fafafa;
    }
    .tab-count {
      color: #555;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 16px;
      padding-left: 20px;
    }
    .tab-list { list-style: none; }
    .tab-list li { border-bottom: 1px solid #1a1a1a; }
    .tab-list li:last-child { border-bottom: none; }
    .tab-list a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      color: #e5e5e5;
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      transition: background 0.15s;
      border-radius: 4px;
      margin: 0 -8px;
    }
    .tab-list a:hover { background: #1a1a1a; }
    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
      background: #222;
    }
    .tab-domain {
      color: #888;
      font-size: 12px;
      flex-shrink: 0;
    }
    .tab-title-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #1a1a1a;
    }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      background: #fafafa;
      color: #0a0a0a;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }
    .btn:hover { background: #e0e0e0; }
    .btn.secondary {
      background: transparent;
      color: #999;
      border: 1px solid #2a2a2a;
    }
    .btn.secondary:hover { background: #1a1a1a; color: #e5e5e5; }
    .popup-notice {
      margin-top: 10px;
      padding: 12px;
      background: #1a1507;
      border: 1px solid #332d0a;
      border-radius: 6px;
      font-size: 12px;
      color: #c9a500;
      display: none;
      line-height: 1.5;
    }
    .popup-notice strong { color: #e5c200; }
    .popup-notice .steps {
      margin-top: 6px;
      padding-left: 16px;
      color: #a89000;
    }
    .install-banner {
      background: #141414;
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      padding: 20px;
      text-align: center;
    }
    .install-banner h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #999;
    }
    .install-banner p {
      font-size: 12px;
      color: #555;
      margin-bottom: 14px;
    }
    .error-state {
      text-align: center;
      padding: 48px 20px;
      color: #555;
    }
    .error-state h2 {
      font-size: 16px;
      font-weight: 600;
      color: #e5e5e5;
      margin-bottom: 6px;
    }
    .error-state p { font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>GroupShare</h1>
      <p>Shared tab group</p>
    </header>
    <div id="content">
      <div class="error-state">
        <h2>Loading...</h2>
        <p>Decoding your shared tabs.</p>
      </div>
    </div>
  </div>

  <script>
    const GROUP_COLORS = {
      grey: "#5f6368", blue: "#1a73e8", red: "#d93025", yellow: "#f9ab00",
      green: "#1e8e3e", pink: "#d01884", purple: "#a142f4", cyan: "#007b83",
      orange: "#e8710a"
    };

    function fromBase64Url(b64) {
      let s = b64.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      return decodeURIComponent(escape(atob(s)));
    }

    function getDomain(url) {
      try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; }
    }

    function getFaviconUrl(url) {
      try {
        const u = new URL(url);
        return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=32`;
      } catch { return ""; }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function render() {
      const content = document.getElementById("content");
      const hash = window.location.hash.slice(1);

      if (!hash) {
        content.innerHTML = `
          <div class="error-state">
            <h2>No shared group found</h2>
            <p>This page decodes GroupShare links. Use the extension to generate one.</p>
          </div>`;
        return;
      }

      let payload;
      try {
        payload = JSON.parse(fromBase64Url(hash));
      } catch {
        content.innerHTML = `
          <div class="error-state">
            <h2>Invalid link</h2>
            <p>Could not decode this GroupShare link. It may be corrupted.</p>
          </div>`;
        return;
      }

      if (!payload.u || !Array.isArray(payload.u) || payload.u.length === 0) {
        content.innerHTML = `
          <div class="error-state">
            <h2>Empty group</h2>
            <p>No URLs were found in this shared group.</p>
          </div>`;
        return;
      }

      const color = GROUP_COLORS[payload.c] || GROUP_COLORS.grey;
      const title = payload.t || "Shared Group";
      const urls = payload.u.filter(u => {
        try { const p = new URL(u); return ["http:", "https:"].includes(p.protocol); }
        catch { return false; }
      });

      const tabsHtml = urls.map(url => `
        <li>
          <a href="${escapeHtml(url)}" target="_blank" rel="noopener">
            <img class="tab-favicon" src="${escapeHtml(getFaviconUrl(url))}" alt="" onerror="this.style.display='none'">
            <span class="tab-title-text">${escapeHtml(getDomain(url))}</span>
          </a>
        </li>`).join("");

      content.innerHTML = `
        <div class="card">
          <div class="group-header">
            <span class="color-dot" style="background: ${color}"></span>
            <span class="group-title">${escapeHtml(title)}</span>
          </div>
          <div class="tab-count">${urls.length} tab${urls.length !== 1 ? "s" : ""}</div>
          <ul class="tab-list">${tabsHtml}</ul>
          <div class="actions">
            <button class="btn" id="open-all-btn">Open All Tabs</button>
            <button class="btn secondary" id="copy-urls-btn">Copy All URLs</button>
          </div>
          <div class="popup-notice" id="popup-notice">
            <strong>Popups were blocked by your browser.</strong>
            <ol class="steps">
              <li>Click the blocked popup icon in your address bar (top right)</li>
              <li>Select "Always allow popups from this site"</li>
              <li>Click <strong>Open All Tabs</strong> again</li>
            </ol>
          </div>
        </div>
        <div class="install-banner">
          <h3>Get the GroupShare Extension</h3>
          <p>Opens all tabs in a Chrome Tab Group instantly — no popup issues.</p>
          <a class="btn secondary" href="https://github.com/vijay2411/Chrome-Group-Share-Extension-Serverless#installation" target="_blank" rel="noopener">View on GitHub</a>
        </div>`;

      document.getElementById("open-all-btn").addEventListener("click", () => openAll(urls));
      document.getElementById("copy-urls-btn").addEventListener("click", () => copyUrls(urls));
    }

    function openAll(urls) {
      if (urls.length === 0) return;
      // Open ALL tabs synchronously within the click handler.
      // Browsers allow multiple window.open calls in the same
      // synchronous execution context of a user-initiated event.
      // If popups are blocked, user needs to allow once — then it works forever.
      let blocked = false;
      for (const url of urls) {
        const w = window.open(url, "_blank", "noopener");
        if (!w) blocked = true;
      }
      if (blocked) {
        document.getElementById("popup-notice").style.display = "block";
      }
    }

    function copyUrls(urls) {
      const text = urls.join("\n");
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copy-urls-btn");
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy All URLs"; }, 1500);
      });
    }

    render();
  </script>
</body>
</html>
